name: Build Binnie's Mods

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ForestryCE + Binnie's Mods
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out Binnie's Mods
        uses: actions/checkout@v4

      - name: Check out official ForestryCE source
        uses: actions/checkout@v4
        with:
          repository: thedarkcolour/ForestryCE
          ref: 1.21.1
          path: forestry-ce

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle caches
        uses: gradle/actions/setup-gradle@v4

      - name: Publish ForestryCE split modules to runner Maven Local
        working-directory: forestry-ce
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain publishToMavenLocal

      - name: Build and validate Binnie's Mods
        run: |
          chmod +x gradlew
          ./gradlew \
            --no-daemon \
            --console=plain \
            clean \
            build \
            validateLegacyCatalogs \
            validateBinnieResources

      - name: Upload Binnie's Mods artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: binnie-mods-neoforge-1.21.1
          path: |
            build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
